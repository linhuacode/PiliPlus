
name: PiliPlus Android Build

on:
  workflow_dispatch:
  # 如果还希望每次推送 main 自动编译，取消下面注释
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Check environment
        run: |
          flutter --version
          java -version
          git --version

      - name: Apply PiliPlus Android patches
        shell: pwsh
        run: |
          ./lib/scripts/patch.ps1 -platform android

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
